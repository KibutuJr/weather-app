<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
            animation: fadeIn 1s ease-in-out;
        }
        .card h1 {
            margin: 0 0 10px;
            font-size: 24px;
            color: #333;
        }
        .card p {
            margin: 8px 0;
            font-size: 18px;
        }
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #74ebd5;
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #66d3c5;
        }
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #555;
        }
        footer p {
            margin: 0;
        }
        footer a {
            color: #555;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="city">Loading...</h1>
        <p id="temp"></p>
        <p id="desc"></p>
        <button class="btn" onclick="fetchWeather()">Refresh</button>
    </div>

    <footer>
        <p>&copy; <a href="https://kibutujr.github.io/Portfolio-KibutuJr/" target="_blank">KibutuJr</a>. All rights reserved.</p>
    </footer>

    <script>
        async function fetchWeather() {
            const res = await fetch('/api/weather?lat=1.2921&lon=36.8219&tz=Africa/Nairobi');
            const data = await res.json();

            if (data.forecast.length > 0) {
                const today = data.forecast[0];
                document.getElementById('city').innerText = "Nairobi, Kenya";
                document.getElementById('temp').innerText = `Temperature: ${today.temp.day}°C`;
                document.getElementById('desc').innerText = today.weather[0].description;
            } else {
                document.getElementById('city').innerText = "No data found";
            }
        }

        fetchWeather();
    </script>
</body>
</html>
